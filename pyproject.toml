[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantcheck"
version = "0.2.0.dev0"
description = "Deterministic point-in-time financial data reliability auditing framework."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QuantCheck maintainers" }]
dependencies = [
    "httpx>=0.28,<1",
    "pyarrow>=24,<25",
    "pydantic>=2,<3",
    "typer>=0.12,<1",
]

[project.scripts]
quantcheck = "quantcheck.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.14,<0.15",
    "mypy>=1.14,<2",
    "pytest>=8,<9",
    "hypothesis>=6,<7",
]
# The read-only dashboard is a repository-local surface: `dashboard/` is not in
# the wheel or the sdist (same rule as `scripts/`), so Streamlit is not declared
# as a runtime dependency of the distributed package. See ADR-008.
dashboard = ["streamlit>=1.40,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/quantcheck"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/LICENSE",
    "/.python-version",
    "/.gitignore",
]
exclude = [
    "/reference",
    "/prompts",
    "/START_HERE.txt",
    "/RECOVERY_SEQUENCE.md",
    "/AGENTS.md",
    "/PROJECT_SCOPE.md",
    "/MVP_ACCEPTANCE_CRITERIA.md",
    "/IMPLEMENT.md",
    "/docs",
    "/dashboard",
    "/scripts",
    "/.streamlit",
    "/.claude",
    "/.serena",
    "/.venv",
    "/dist",
    "**/__pycache__",
    "**/*.py[cod]",
    "/.mypy_cache",
    "/.ruff_cache",
    "/.pytest_cache",
    "/.hypothesis",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
