name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan locked dependencies for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          version: v0.73.0

      - name: Scan repository and history checkout for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: 1
          format: table
          version: v0.73.0

  container-security:
    name: Container build, SBOM, scan, and reproducibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Record immutable build inputs
        id: build-inputs
        shell: bash
        run: |
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build local security candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: quantcheck-security:${{ github.sha }}
          provenance: false
          sbom: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.build-inputs.outputs.epoch }}
            VCS_REF=${{ steps.build-inputs.outputs.revision }}

      - name: Scan container for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: quantcheck-security:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table
          version: v0.73.0

      - name: Generate SPDX 2.3 container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: quantcheck-security:${{ github.sha }}
          format: spdx-json
          output-file: quantcheck-container.spdx.json
          artifact-name: quantcheck-container-sbom
          upload-artifact: true
          syft-version: v1.50.0

      - name: Verify repeatable OCI output
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build-inputs.outputs.epoch }}
          VCS_REF: ${{ steps.build-inputs.outputs.revision }}
        run: scripts/verify_container_reproducibility.sh
