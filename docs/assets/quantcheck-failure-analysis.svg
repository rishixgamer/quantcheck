      <text x="385" y="493" font-size="14" font-weight="700" fill="#667085">10 cases</text>
      <text x="530" y="493" font-size="14">No 30-day natural filing lag in the reviewed fixture.</text>

      <rect x="54" y="526" width="1092" height="53" rx="10" fill="#FFFFFF" stroke="#D0D5DD"/>
      <rect x="73" y="540" width="22" height="22" fill="url(#slate-hatch)" stroke="#667085"/>
      <text x="113" y="557" font-size="14" font-weight="700">Revision Overwrite / medium</text>
      <text x="385" y="557" font-size="14" font-weight="700" fill="#667085">10 cases</text>
      <text x="530" y="557" font-size="14">Declared history changes by 2%, below the frozen 5% threshold.</text>

      <rect x="54" y="590" width="1092" height="53" rx="10" fill="#FFFFFF" stroke="#D0D5DD"/>
      <rect x="73" y="604" width="22" height="22" fill="url(#slate-hatch)" stroke="#667085"/>
      <text x="113" y="621" font-size="14" font-weight="700">Revision Overwrite / high</text>
      <text x="385" y="621" font-size="14" font-weight="700" fill="#667085">10 cases</text>
      <text x="530" y="621" font-size="14">Declared history changes by 2%, below the frozen 20% threshold.</text>
    </g>

    <text x="54" y="666" font-size="11" fill="#667085">Evidence: agg_571aae0b7c60a4a5 · release_evidence/final/public/aggregate_report.json · release_evidence/final/public/case_matrix.json</text>
  </g>
