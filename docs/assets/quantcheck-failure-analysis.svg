<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">What the benchmark keeps visible</title>
  <desc id="desc">The frozen v0.1 benchmark reports 130 exact matches, 78 strict cross-detector false-positive findings, zero false-negative faults among successful scored cases, and 30 structural no-target cases. The no-target cases are ten Look-Ahead high cases without a 30-day natural filing lag, ten Revision Overwrite medium cases where the declared history changes by 2 percent rather than 5 percent, and ten Revision Overwrite high cases where the same history changes by 2 percent rather than 20 percent.</desc>
  <defs>
    <pattern id="slate-hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#F2F4F7"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#667085" stroke-width="3" opacity="0.3"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="678" rx="22" fill="#FCFCFA" stroke="#D0D5DD" stroke-width="2"/>
  <g font-family="Inter, 'Source Sans 3', Arial, sans-serif" fill="#17212B">
    <text x="54" y="58" font-size="30" font-weight="700">What the benchmark keeps visible</text>
    <text x="54" y="88" font-size="15" fill="#667085">False positives, misses, and structural no-target cells are separate scientific outcomes.</text>
    <rect x="864" y="27" width="282" height="38" rx="19" fill="#EAF2FF" stroke="#175CD3"/>
    <text x="1005" y="51" text-anchor="middle" font-size="13" font-weight="700" fill="#175CD3">FROZEN v0.1 · SYNTHETIC</text>

    <g>
      <rect x="54" y="125" width="255" height="150" rx="14" fill="#EAF2FF" stroke="#175CD3" stroke-width="2"/>
      <circle cx="84" cy="158" r="8" fill="#175CD3"/>
      <text x="105" y="163" font-size="13" font-weight="700" fill="#175CD3">EXACT MATCHES</text>
      <text x="80" y="220" font-size="44" font-weight="700">130</text>
      <text x="80" y="249" font-size="13" fill="#667085">one-to-one against hidden truth</text>

      <rect x="333" y="125" width="255" height="150" rx="14" fill="#FCFCFA" stroke="#B42318" stroke-width="3"/>
      <rect x="363" y="149" width="16" height="16" fill="none" stroke="#B42318" stroke-width="2"/>
      <text x="392" y="163" font-size="13" font-weight="700" fill="#B42318">STRICT FALSE POSITIVES</text>
      <text x="359" y="220" font-size="44" font-weight="700">78</text>
      <text x="359" y="246" font-size="13" fill="#667085">cross-detector findings retained</text>

      <rect x="612" y="125" width="255" height="150" rx="14" fill="#FFFFFF" stroke="#667085" stroke-width="2"/>
      <path d="M642 149L658 165M658 149L642 165" stroke="#667085" stroke-width="2"/>
      <text x="671" y="163" font-size="13" font-weight="700" fill="#667085">FALSE-NEGATIVE FAULTS</text>
      <text x="638" y="220" font-size="44" font-weight="700">0</text>
      <text x="678" y="207" font-size="12" fill="#667085">among successful</text>
      <text x="678" y="225" font-size="12" fill="#667085">scored cases</text>
      <text x="638" y="249" font-size="13" fill="#667085">fixture-bounded, not general recall</text>

      <rect x="891" y="125" width="255" height="150" rx="14" fill="url(#slate-hatch)" stroke="#667085" stroke-width="2"/>
      <rect x="921" y="149" width="16" height="16" fill="#FCFCFA" stroke="#667085" stroke-width="2"/>
      <text x="950" y="163" font-size="13" font-weight="700" fill="#667085">STRUCTURAL NO-TARGET</text>
      <text x="917" y="220" font-size="44" font-weight="700">30</text>
      <text x="917" y="249" font-size="13" font-weight="700" fill="#667085">not a miss</text>
    </g>

    <rect x="54" y="306" width="1092" height="90" rx="14" fill="#F7FAFF" stroke="#175CD3"/>
    <text x="80" y="335" font-size="13" font-weight="700" fill="#175CD3">WHY 78 STRICT FALSE POSITIVES REMAIN</text>
    <text x="80" y="361" font-size="15">All four detectors run on every case. The score uses the case's predeclared primary family.</text>
    <text x="80" y="383" font-size="15">A valid warning from another family stays visible and counts against strict primary-family precision.</text>

    <text x="54" y="444" font-size="13" font-weight="700" fill="#667085">THE 30 STRUCTURAL NO-TARGET CASES</text>
    <g>
      <rect x="54" y="462" width="1092" height="53" rx="10" fill="#FFFFFF" stroke="#D0D5DD"/>
