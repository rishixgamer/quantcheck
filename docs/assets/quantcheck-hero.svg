<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">QuantCheck manifest-blind audit boundary</title>
  <desc id="desc">A clean point-in-time snapshot enters controlled injection. The private manifest is separated from a sanitized public audit input. Detectors produce a finalized report, and only then does exact scoring meet private truth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1324"/><stop offset="1" stop-color="#152946"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#43b7ff"/><stop offset="1" stop-color="#78e0d0"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#ffca6b"/><stop offset="1" stop-color="#ff8b7b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#78e0d0"/></marker>
  </defs>
  <rect width="1600" height="620" rx="28" fill="url(#bg)"/>
  <text x="80" y="86" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700">Point-in-time evidence, with the answer key out of reach</text>
  <text x="82" y="126" fill="#b8c8df" font-family="Inter,Arial,sans-serif" font-size="20">The detector sees a sanitized snapshot. Private truth enters only after the audit report is final.</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="80" y="220" width="250" height="150" rx="18" fill="#1d3d63" stroke="#43b7ff" stroke-width="2"/>
    <text x="110" y="268" fill="#78e0d0" font-size="16" font-weight="700">PUBLIC INPUT</text>
    <text x="110" y="307" fill="#fff" font-size="24" font-weight="700">Clean snapshot</text>
    <text x="110" y="340" fill="#c9d7e8" font-size="16">period · filed · available</text>
    <rect x="430" y="220" width="250" height="150" rx="18" fill="#553e28" stroke="#ffca6b" stroke-width="2"/>
    <text x="460" y="268" fill="#ffca6b" font-size="16" font-weight="700">CONTROLLED TEST</text>
    <text x="460" y="307" fill="#fff" font-size="24" font-weight="700">Inject a fault</text>
    <text x="460" y="340" fill="#f7dfb0" font-size="16">seed · severity · subtype</text>
    <rect x="780" y="220" width="300" height="150" rx="18" fill="#1d3d63" stroke="#43b7ff" stroke-width="2"/>
    <text x="810" y="268" fill="#78e0d0" font-size="16" font-weight="700">PUBLIC TRUST BOUNDARY</text>
    <text x="810" y="307" fill="#fff" font-size="24" font-weight="700">Sanitized audit input</text>
    <text x="810" y="340" fill="#c9d7e8" font-size="16">no manifest · no clean value</text>
    <rect x="1180" y="220" width="300" height="150" rx="18" fill="#1d3d63" stroke="#78e0d0" stroke-width="2"/>
    <text x="1210" y="268" fill="#78e0d0" font-size="16" font-weight="700">MANIFEST-BLIND</text>
    <text x="1210" y="307" fill="#fff" font-size="24" font-weight="700">Detectors</text>
    <text x="1210" y="340" fill="#c9d7e8" font-size="16">findings → finalized report</text>
  </g>
  <path d="M330 295H420" stroke="#78e0d0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M680 295H770" stroke="#78e0d0" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1080 295H1170" stroke="#78e0d0" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="430" y="450" width="250" height="88" rx="16" fill="#382f3e" stroke="#ff8b7b" stroke-width="2"/>
  <text x="460" y="485" fill="#ffca6b" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">PRIVATE ONLY</text>
  <text x="460" y="515" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Fault manifest</text>
  <path d="M555 450V382" stroke="#ffca6b" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M1330 370V450H805" stroke="#78e0d0" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="805" y="450" width="390" height="88" rx="16" fill="#203b3e" stroke="#78e0d0" stroke-width="2"/>
  <text x="835" y="485" fill="#78e0d0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">AFTER FINALIZATION</text>
  <text x="835" y="515" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Exact scoring + replay evidence</text>
  <text x="80" y="584" fill="#8fa7c3" font-family="Inter,Arial,sans-serif" font-size="15">Illustration of the v0.1 trust boundary. It is a method diagram, not a performance claim.</text>
</svg>
