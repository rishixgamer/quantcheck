<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">QuantCheck failure analysis</title>
  <desc id="desc">Two evidence panels keep different failure meanings separate. Frozen v0.1 has 130 exact matches, 78 strict cross-detector false positives, zero false-negative faults, and 30 structural no-target cases. Synthetic v0.2 validation has 4046 primary matches, 897 false-positive findings, and 164 false-negative faults across 390 completed cases.</desc>
  <rect width="1200" height="520" rx="24" fill="#f6f8fb"/>
  <text x="56" y="54" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#10243e">Retain the awkward outcomes</text>
  <text x="56" y="84" font-family="Inter,Arial,sans-serif" font-size="16" fill="#52657c">A miss, a cross-detector warning, and an ineligible test cell are different scientific outcomes.</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="56" y="120" width="520" height="300" rx="18" fill="#ffffff" stroke="#d6e0eb"/>
    <text x="84" y="158" font-size="14" font-weight="700" fill="#52657c">FROZEN v0.1 HELD-OUT</text>
    <text x="84" y="187" font-size="22" font-weight="700" fill="#10243e">Controlled synthetic benchmark</text>
    <text x="84" y="220" font-size="14" fill="#52657c">94 successful cases · 30 structural no-target cases</text>
    <rect x="84" y="252" width="300" height="24" rx="12" fill="#175cd3"/>
    <text x="398" y="270" font-size="15" font-weight="700" fill="#10243e">130 exact matches</text>
    <rect x="84" y="294" width="180" height="24" rx="12" fill="#b42318"/>
    <text x="278" y="312" font-size="15" font-weight="700" fill="#10243e">78 strict FP findings</text>
    <text x="84" y="356" font-size="15" fill="#10243e"><tspan font-weight="700">0</tspan> false-negative faults among scored cases</text>
    <text x="84" y="384" font-size="14" fill="#52657c">FPs are cross-detector signals under primary-family scoring.</text>
    <text x="84" y="407" font-size="14" fill="#52657c">No-target cells were retained, not converted into misses.</text>

    <rect x="624" y="120" width="520" height="300" rx="18" fill="#ffffff" stroke="#d6e0eb"/>
    <text x="652" y="158" font-size="14" font-weight="700" fill="#52657c">SYNTHETIC v0.2 VALIDATION</text>
    <text x="652" y="187" font-size="22" font-weight="700" fill="#10243e">390 completed fault cases</text>
    <text x="652" y="220" font-size="14" fill="#52657c">Engineering evidence only — not customer validation</text>
    <rect x="652" y="252" width="300" height="24" rx="12" fill="#175cd3"/>
    <text x="966" y="270" font-size="15" font-weight="700" fill="#10243e">4,046 primary matches</text>
    <rect x="652" y="294" width="220" height="24" rx="12" fill="#b42318"/>
    <text x="886" y="312" font-size="15" font-weight="700" fill="#10243e">897 false-positive findings</text>
    <text x="652" y="356" font-size="15" fill="#10243e"><tspan font-weight="700">164</tspan> false-negative faults</text>
    <text x="652" y="384" font-size="14" fill="#52657c">Misses remain visible instead of being tuned away.</text>
    <text x="652" y="407" font-size="14" fill="#52657c">All values are from the saved validation aggregate.</text>
  </g>
  <line x1="56" y1="454" x2="1144" y2="454" stroke="#c5d1df"/>
  <text x="56" y="484" font-family="Inter,Arial,sans-serif" font-size="14" fill="#52657c">Sources: evidence/v0_1_release/aggregate_report.json and evidence/design_partner_beta/validation_aggregate.json.</text>
</svg>
