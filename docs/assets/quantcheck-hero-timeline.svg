<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">The future arrives early</title>
  <desc id="desc">A timeline shows quarter end on March 31, a research decision on April 15, a filing becoming public on May 10, and the later research output. A dashed rust path moves the filing value's apparent availability back to March 31. A callout beneath that corrupted date explains that QuantCheck flags the detector-visible temporal contradiction.</desc>
  <defs>
    <marker id="arrow-rust" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#B42318"/>
    </marker>
    <pattern id="slate-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#F2F4F7"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#667085" stroke-width="2" opacity="0.28"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="558" rx="22" fill="#FCFCFA" stroke="#D0D5DD" stroke-width="2"/>
  <g font-family="Inter, 'Source Sans 3', Arial, sans-serif" fill="#17212B">
    <text x="54" y="62" font-size="30" font-weight="700">The future arrives early</text>
    <text x="54" y="94" font-size="16" fill="#667085">A controlled availability error changes what the researcher appears to know.</text>

    <rect x="415" y="122" width="190" height="206" rx="16" fill="#FFF8EB" stroke="#A15C00" stroke-width="2"/>
    <text x="510" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#A15C00">DECISION BOUNDARY</text>

    <line x1="120" y1="242" x2="1080" y2="242" stroke="#667085" stroke-width="3"/>
    <path d="M1080 242L1066 234V250Z" fill="#667085"/>

    <g>
      <circle cx="190" cy="242" r="10" fill="#FCFCFA" stroke="#175CD3" stroke-width="4"/>
      <line x1="190" y1="214" x2="190" y2="178" stroke="#175CD3" stroke-width="2"/>
      <text x="190" y="148" text-anchor="middle" font-size="16" font-weight="700">Quarter ends</text>
      <text x="190" y="172" text-anchor="middle" font-size="15" fill="#667085">Mar 31</text>
    </g>

    <g>
      <circle cx="510" cy="242" r="15" fill="#A15C00" stroke="#FCFCFA" stroke-width="5"/>
      <line x1="510" y1="212" x2="510" y2="178" stroke="#A15C00" stroke-width="3"/>
      <text x="510" y="148" text-anchor="middle" font-size="18" font-weight="700">Research decision</text>
      <text x="510" y="173" text-anchor="middle" font-size="16" font-weight="700" fill="#A15C00">Apr 15</text>
    </g>

    <g>
      <circle cx="850" cy="242" r="10" fill="#175CD3" stroke="#FCFCFA" stroke-width="3"/>
      <line x1="850" y1="214" x2="850" y2="178" stroke="#175CD3" stroke-width="2"/>
      <text x="850" y="148" text-anchor="middle" font-size="16" font-weight="700">Filing becomes public</text>
      <text x="850" y="172" text-anchor="middle" font-size="15" fill="#667085">May 10</text>
    </g>

    <g>
      <rect x="1016" y="226" width="32" height="32" rx="5" fill="url(#slate-hatch)" stroke="#667085" stroke-width="2"/>
      <line x1="1032" y1="214" x2="1032" y2="178" stroke="#667085" stroke-width="2"/>
      <text x="1032" y="148" text-anchor="middle" font-size="16" font-weight="700">Research output</text>
      <text x="1032" y="172" text-anchor="middle" font-size="15" fill="#667085">result changes</text>
    </g>

    <path d="M850 278C760 345 390 345 202 278" fill="none" stroke="#B42318" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-rust)"/>
    <rect x="424" y="298" width="270" height="36" rx="18" fill="#FCFCFA" stroke="#B42318" stroke-width="1.5"/>
    <text x="559" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#B42318">Future value appears early</text>

    <line x1="190" y1="268" x2="190" y2="354" stroke="#B42318" stroke-width="4" stroke-dasharray="7 6"/>
    <circle cx="190" cy="278" r="9" fill="#FCFCFA" stroke="#B42318" stroke-width="4"/>
    <text x="190" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#B42318">Corrupted availability date</text>
    <text x="190" y="405" text-anchor="middle" font-size="15" fill="#B42318">Mar 31</text>

    <path d="M292 369H380" fill="none" stroke="#B42318" stroke-width="2" marker-end="url(#arrow-rust)"/>
    <rect x="380" y="348" width="384" height="92" rx="14" fill="#FFF5F4" stroke="#B42318" stroke-width="2"/>
    <text x="404" y="378" font-size="15" font-weight="700" fill="#B42318">QuantCheck flags violation</text>
    <text x="404" y="402" font-size="14">At Apr 15, the record claims to be available.</text>
    <text x="404" y="423" font-size="14">Its filing proves it did not become public until May 10.</text>

    <line x1="54" y1="474" x2="1146" y2="474" stroke="#D0D5DD"/>
    <circle cx="68" cy="505" r="6" fill="#175CD3"/>
    <text x="84" y="510" font-size="14">Observed/public event</text>
    <line x1="257" y1="505" x2="291" y2="505" stroke="#B42318" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="305" y="510" font-size="14">Controlled mutation</text>
    <text x="1146" y="510" text-anchor="end" font-size="14" font-weight="700">Day-level, end-of-day availability semantics</text>
    <text x="54" y="538" font-size="12" fill="#667085">Evidence: conceptual method illustration · docs/faults/LOOK_AHEAD.md · not benchmark evidence</text>
  </g>
</svg>
