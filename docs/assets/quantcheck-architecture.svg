<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Truth stays hidden until scoring</title>
  <desc id="desc">The primary horizontal audit flow moves from private clean data through deterministic fault injection, sanitized public audit input, detector, finalized findings, hidden-manifest scoring, and research-impact comparison. A separate hatched private lane carries the fault manifest from injection to scoring only after audit finalization. No line connects the manifest to the detector.</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#175CD3"/>
    </marker>
    <marker id="rust-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#B42318"/>
    </marker>
    <marker id="slate-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#667085"/>
    </marker>
    <pattern id="private-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#F2F4F7"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#667085" stroke-width="3" opacity="0.32"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1398" height="648" rx="22" fill="#FCFCFA" stroke="#D0D5DD" stroke-width="2"/>
  <g font-family="Inter, 'Source Sans 3', Arial, sans-serif" fill="#17212B">
    <text x="54" y="62" font-size="30" font-weight="700">Truth stays hidden until scoring</text>
    <text x="54" y="94" font-size="16" fill="#667085">Detectors see sanitized audit input. Private truth meets finalized findings only afterward.</text>

    <rect x="54" y="123" width="1292" height="248" rx="18" fill="#F7FAFF" stroke="#175CD3" stroke-width="1.5"/>
    <text x="78" y="151" font-size="13" font-weight="700" fill="#175CD3">PRIMARY DETECTOR PATH · PUBLIC AFTER SANITIZATION</text>

    <g>
      <rect x="76" y="196" width="154" height="112" rx="12" fill="url(#private-hatch)" stroke="#667085" stroke-width="2"/>
      <text x="153" y="229" text-anchor="middle" font-size="13" font-weight="700" fill="#667085">PRIVATE</text>
      <text x="153" y="255" text-anchor="middle" font-size="16" font-weight="700">Clean data</text>
      <text x="153" y="278" text-anchor="middle" font-size="13" fill="#667085">point-in-time snapshot</text>

      <rect x="264" y="196" width="166" height="112" rx="12" fill="#FFF5F4" stroke="#B42318" stroke-width="2"/>
      <text x="347" y="229" text-anchor="middle" font-size="13" font-weight="700" fill="#B42318">CONTROLLED</text>
      <text x="347" y="255" text-anchor="middle" font-size="16" font-weight="700">Deterministic</text>
      <text x="347" y="278" text-anchor="middle" font-size="16" font-weight="700">fault injection</text>

      <rect x="464" y="196" width="170" height="112" rx="12" fill="#FFFFFF" stroke="#175CD3" stroke-width="2"/>
      <text x="549" y="229" text-anchor="middle" font-size="13" font-weight="700" fill="#175CD3">PUBLIC TO DETECTOR</text>
      <text x="549" y="255" text-anchor="middle" font-size="16" font-weight="700">Sanitized</text>
      <text x="549" y="278" text-anchor="middle" font-size="16" font-weight="700">audit input</text>

      <rect x="668" y="196" width="136" height="112" rx="12" fill="#FFFFFF" stroke="#175CD3" stroke-width="2"/>
      <text x="736" y="229" text-anchor="middle" font-size="13" font-weight="700" fill="#175CD3">BLIND</text>
      <text x="736" y="260" text-anchor="middle" font-size="17" font-weight="700">Detector</text>
      <text x="736" y="282" text-anchor="middle" font-size="13" fill="#667085">public fields only</text>

      <rect x="838" y="196" width="152" height="112" rx="12" fill="#FFFFFF" stroke="#175CD3" stroke-width="2"/>
      <text x="914" y="229" text-anchor="middle" font-size="13" font-weight="700" fill="#175CD3">IMMUTABLE</text>
      <text x="914" y="255" text-anchor="middle" font-size="16" font-weight="700">Finalized</text>
      <text x="914" y="278" text-anchor="middle" font-size="16" font-weight="700">findings</text>

      <rect x="1024" y="196" width="158" height="112" rx="12" fill="#FFFFFF" stroke="#175CD3" stroke-width="2"/>
      <text x="1103" y="229" text-anchor="middle" font-size="13" font-weight="700" fill="#175CD3">POST-AUDIT</text>
      <text x="1103" y="255" text-anchor="middle" font-size="16" font-weight="700">Hidden-manifest</text>
      <text x="1103" y="278" text-anchor="middle" font-size="16" font-weight="700">scoring</text>

      <rect x="1216" y="196" width="110" height="112" rx="12" fill="#FFFFFF" stroke="#175CD3" stroke-width="2"/>
      <text x="1271" y="229" text-anchor="middle" font-size="13" font-weight="700" fill="#175CD3">CONTROLLED</text>
      <text x="1271" y="254" text-anchor="middle" font-size="14" font-weight="700">Research-</text>
      <text x="1271" y="274" text-anchor="middle" font-size="14" font-weight="700">impact</text>
      <text x="1271" y="294" text-anchor="middle" font-size="14" font-weight="700">comparison</text>
    </g>

    <g fill="none" stroke-width="3" marker-end="url(#blue-arrow)">
      <path d="M230 252H256" stroke="#175CD3"/>
      <path d="M430 252H456" stroke="#B42318" marker-end="url(#rust-arrow)"/>
      <path d="M634 252H660" stroke="#175CD3"/>
      <path d="M804 252H830" stroke="#175CD3"/>
      <path d="M990 252H1016" stroke="#175CD3"/>
      <path d="M1182 252H1208" stroke="#175CD3"/>
    </g>

    <rect x="54" y="400" width="1292" height="155" rx="18" fill="#F8F9FB" stroke="#667085" stroke-width="1.5"/>
    <text x="530" y="430" font-size="13" font-weight="700" fill="#667085">PRIVATE TRUTH LANE · HATCHED AND PHYSICALLY SEPARATE</text>
    <rect x="268" y="458" width="214" height="64" rx="11" fill="url(#private-hatch)" stroke="#667085" stroke-width="2"/>
    <text x="375" y="483" text-anchor="middle" font-size="14" font-weight="700" fill="#667085">PRIVATE FAULT MANIFEST</text>
    <text x="375" y="507" text-anchor="middle" font-size="13">targets · originals · mutations</text>
    <path d="M347 308V448" fill="none" stroke="#667085" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#slate-arrow)"/>
    <path d="M482 490H1089V318" fill="none" stroke="#667085" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#slate-arrow)"/>
    <rect x="670" y="464" width="298" height="50" rx="25" fill="#FCFCFA" stroke="#667085"/>
    <text x="819" y="485" text-anchor="middle" font-size="13" font-weight="700" fill="#667085">ONLY AFTER AUDIT FINALIZATION</text>
    <text x="819" y="503" text-anchor="middle" font-size="12" fill="#667085">dashed private connector terminates at scoring</text>

    <rect x="54" y="576" width="1292" height="45" rx="10" fill="#FFF5F4" stroke="#B42318" stroke-width="1.5"/>
    <text x="700" y="604" text-anchor="middle" font-size="15" font-weight="700" fill="#B42318">Detector never receives manifest, clean values, or injection metadata.</text>
    <text x="54" y="640" font-size="12" fill="#667085">Evidence: docs/METHODOLOGY.md · docs/ARTIFACTS_AND_PRIVACY.md · method diagram, not performance evidence</text>
  </g>
</svg>
